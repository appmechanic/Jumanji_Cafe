<div class="container-fluid w-full py-5 ">
  <div class="row justify-content-center">
    <div class="col-11 col-md-10 col-lg-10 col-xl-9">
      <app-heading-section iconLeft="videogame_asset" iconLeftType="material" iconLeftColor="bg-primary2"
        iconRight="bi-trophy-fill" iconRightType="bootstrap" iconRightColor="bg-secondary2"
        [title]="gameStore.hero?.title" [highlight]="gameStore.hero?.highlight" highlightColor="gradient-text"
        subtitleColor="text-color2" [subtitle]="gameStore.hero?.subtitle">
      </app-heading-section>
    </div>
  </div>
</div>

<div class="container">
  <app-filter-tab [data]="getFeaturedGameStats()" [config]="gameFilterConfig"
    (filteredDataChange)="onGamesFilteredDataChange($event)">
  </app-filter-tab>
</div>
<div class="container-fluid custom-width">
  <div class="row">
    <div class="col-2 mb-4">
      <app-sidebar-filter [filters]="sidebarFilters" (filterChange)="onSidebarFilterChange($event)">
      </app-sidebar-filter>
    </div>
    <div class="col-10">
      <div class="row">
        <!-- Update the showcase cards section to include the cardClick event -->
        <div class="col-lg-6 col-xl-4 col-12 d-flex" *ngFor="let game of featuredGames">
          <app-showcase-card
            [imageSrc]="game.imageSrc"
            [category]="game.category"
            [categoryColor]="game.categoryColor"
            [title]="game.title"
            [subtitle]="game.subtitle"
            [players]="game.players"
            [playersClass]="game.playersClass"
            [duration]="game.duration"
            [durationClass]="game.durationClass"
            [tags]="game.tags"
            [tagColor]="game.tagColor"
            [buttonText]="game.buttonText"
            [buttonColor]="game.buttonColor"
            [starCount]="game.starCount"
            [starColor]="game.starColor"
            [showDetailIcon]="game.showDetailIcon"
            [detailIcon]="game.detailIcon"
            [price]="game.price"
            [productDetail]="game.productDetail"
            [productId]="game.productId"
            (cardClick)="onCardClick($event)"
            class="w-100">
          </app-showcase-card>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Product Detail Modal -->
<app-product-detail
  *ngIf="showProductDetailModal"
  [productId]="selectedProduct.id"
  [productData]="selectedProduct"
  (closeModal)="closeProductDetailModal()">
</app-product-detail>
