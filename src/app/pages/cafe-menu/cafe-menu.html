<div class="container py-5">
  <div class="row">
    <div class="col-12">
      <app-heading-section iconLeft="restaurant" iconLeftType="material" iconLeftColor="bg-secondary2" iconRight="local_cafe" iconRightType="material"
        iconRightColor="bg-primary2" [title]="cafeMenu.title" [highlight]="cafeMenu.highlight" highlightColor="gradient-text"
        [subtitle]="cafeMenu.subtitle">
      </app-heading-section>
    </div>
  </div>
  <div class="row justify-content-center py-5">
    <ng-container *ngFor="let item of getCafeMenuStats()">
      <div class="col-12 col-sm-6 col-lg-4 pb-4">
        <app-showcase-card [imageSrc]="item.imageSrc" [category]="item.category"
          [categoryColor]="item.categoryColor" [title]="item.title" [price]="item.price ?? ''"
          [priceColor]="item.priceColor ?? ''" [subtitle]="item.subtitle" [buttonText]="item.buttonText"
          [buttonColor]="item.buttonColor" [showOverlay]="false">
        </app-showcase-card>
      </div>
    </ng-container>
  </div>
</div>
