<div class="point-guide-card d-flex align-items-center p-3 rounded-4 bg-primary5 gap-2">
    <div class="icon-box d-flex align-items-center justify-content-center"
        [ngClass]="iconColor || 'bg-secondary2 text-white'">
        <i *ngIf="iconType === 'bootstrap' || !iconType" class="bi" [ngClass]="icon"></i>
        <span *ngIf="iconType === 'material'" class="material-icons">{{ icon }}</span>
    </div>
    <div>
        <div class="fw-bold">{{ title }}</div>
        <div *ngIf="subtitle" class="text-primary2">{{ subtitle }}</div>
    </div>
</div>
