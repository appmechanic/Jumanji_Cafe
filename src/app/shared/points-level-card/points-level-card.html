<div class="points-level-card d-flex align-items-center p-4 rounded-4 gap-4"
  [ngClass]="[cardBgColor, shadow ? 'shadow-sm' : '']">
  <!-- Left: Icon and Points -->
  <div class="d-flex flex-column align-items-center justify-content-center  point-col">
    <div class="rounded-circle d-flex align-items-center justify-content-center mb-2" [ngClass]="iconBg"
      style="width:64px;height:64px;">
      <i class="bi" [ngClass]="icon" style="font-size:2rem;"></i>
    </div>
    <div class="fw-bold fs-3 text-secondary2">{{ points }}</div>
    <div class="text-color2 fs-6">{{ subtitle }}</div>
  </div>

  <!-- Middle: Level and Progress -->
  <div class="flex-grow-1 d-flex flex-column align-items-center justify-content-center level-col">
    <div class="fw-bold fs-5 mb-1"> {{ currentLevel }}</div>
    <div class="text-primary2 mb-1">{{ currentLevelName }}</div>
    <div class="d-flex align-items-center w-100 justify-content-between mb-1 px-2">
      <span class="fs-7 text-color2">{{ currentPoints }} </span>
      <span class="fs-7 text-color2">{{ nextLevelPoints }} </span>
    </div>
    <div class="progress position-relative w-100 mb-1 d-flex align-items-center" style="height:10px;">
      <div class="progress-bar gradient-bg" role="progressbar" [style.width.%]="progressPercent"></div>
      <!-- Dot -->
      <span class="progress-dot position-absolute d-flex" [style.left.%]="progressPercent"
        style="top:50%;transform:translate(-50%,-50%);">
        <span class="dot bg-white"></span>
      </span>
    </div>
    <div class="fs-7 text-color2 mt-1">
      {{ pointsToNextLevel }} {{ pointsToNextLevelText }}
    </div>
  </div>

  <!-- Right: Buttons -->
  <div class="d-flex flex-column align-items-end  gap-2 btn-col">
    <app-primary-button *ngIf="primaryBtnText" [text]="primaryBtnText" [iconLeft]="iconPrimary"></app-primary-button>
    <app-ghost-button *ngIf="ghostBtnText" [text]="ghostBtnText" [iconLeft]="iconGhost"></app-ghost-button>
  </div>
</div>
