<div class="testimonial-card px-4 py-5 rounded-4 shadow-sm bg-white position-relative h-100 d-flex flex-column" [ngClass]="cardClass">
    <!-- Inverted comma top-left -->
    <div *ngIf="showInvertedCommas"
        class="testimonial-comma position-absolute gradient-bg d-flex align-items-center justify-content-center rounded-pill">
        <i class="bi bi-quote fw-bold text-white"></i>
    </div>
    <!-- Optional top-right dot -->
    <div *ngIf="showInvertedCommas" class="testimonial-dot position-absolute bg-secondary2 rounded-pill">
        <span class="rounded-circle d-inline-block testimonial-dot-icon"></span>
    </div>
    <!-- Stars -->
    <div class="mb-2 ps-1">
        <ng-container *ngFor="let star of [1,2,3,4,5]; let i = index">
            <ng-container *ngIf="rating >= i + 1">
                <i class="bi bi-star-fill text-warning fs-5 me-1"></i>
            </ng-container>
            <ng-container *ngIf="rating < i + 1 && rating > i">
                <i class="bi bi-star-half text-warning fs-5 me-1"></i>
            </ng-container>
            <ng-container *ngIf="rating <= i">
                <i class="bi bi-star text-warning fs-5 me-1"></i>
            </ng-container>
        </ng-container>
    </div>
    <!-- Quote -->
    <div class="testimonial-quote text-dark mb-3 ps-1">
        {{quote}}
    </div>
    <!-- Tag/Badge -->
    <div *ngIf="tag" class="mb-3 ps-1">
        <span class="rounded-pill px-3 py-2 fw-semibold d-inline-flex gap-2" [ngClass]="tagClass">
    <i *ngIf="!isMaterialIcon(icon)" class="d-flex align-items-center justify-content-center rounded-pill" [ngClass]="icon"></i>
    <i *ngIf="isMaterialIcon(icon)" class="material-icons d-flex align-items-center justify-content-center rounded-pill" [ngClass]="icon.split(' ').slice(1).join(' ')">{{ icon.split(' ')[0] }}</i>
            {{tag}}
        </span>
    </div>
    <!-- User Info -->
    <div class="d-flex align-items-center gap-2">
        <div class="testimonial-img position-relative me-2">
            <img [src]="imageSrc" alt="{{name}}"
                class="rounded-circle gradient-bg border border-light testimonial-img-photo">
            <span *ngIf="showCheckIcon"
                class="testimonial-check position-absolute bg-success text-white rounded-circle d-flex align-items-center justify-content-center">
                <i class="bi bi-check"></i>
            </span>
        </div>
        <div>
            <div class="fw-bold">{{name}}</div>
            <div class="text-muted small">
                <ng-container *ngIf="hasRole() && location">
                    <span>{{role}}, </span>
                    <span>{{location}}</span>
                </ng-container>
                <ng-container *ngIf="!hasRole() && location">
                    <span><i class="bi bi-geo-alt-fill me-1"></i>{{location}}</span>
                </ng-container>
                <ng-container *ngIf="hasRole() && !location">
                    <span>{{role}}</span>
                </ng-container>
            </div>
        </div>
    </div>
</div>
