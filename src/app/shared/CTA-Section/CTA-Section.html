<div class="cta-section w-100 rounded-20 p-4 p-sm-5 text-center d-inline-flex justify-content-center"
     [ngClass]="{'bg-white': bgWhite, 'shadow-sm': bgWhite}">
  <div [ngClass]="colClass || 'col-12 col-lg-9'">
    <div *ngIf="icon" class="icon-circle mx-auto mb-2 d-flex align-items-center justify-content-center rounded-pill" [ngClass]="iconBgClass">
      <i *ngIf="!isMaterialIcon(icon)" class="bi" [ngClass]="icon"></i>
      <i *ngIf="isMaterialIcon(icon)" class="material-icons">{{ icon }}</i>
    </div>
    
    <h4 class="heading mb-2 d-flex flex-wrap justify-content-center gap-2" [ngClass]="titleClass">
      <span [ngClass]="titleClass">{{ titleStart }}</span> <span [ngClass]="titleHighlightClass">{{ titleHighlight }}</span>{{ titleEnd }}
    </h4>

    <p class="description mx-auto mb-3" [ngClass]="descriptionClass">
      {{ description }}
    </p>
    
    <div class="buttons-container d-flex flex-row flex-wrap justify-content-center gap-3">
      <ng-content select="[primaryButton]"></ng-content>
      <ng-content select="[ghostButton]"></ng-content>
    </div>
  </div>
</div>
