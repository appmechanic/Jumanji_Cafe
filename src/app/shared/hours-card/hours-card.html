<div class="location-card-container bg-white w-100 d-flex flex-column rounded-20 gap-4 shadow-sm h-100">

    <div class="location-card-header d-flex flex-column justify-content-center align-items-center gap-3">
        <div class="d-flex flex-row align-items-center justify-content-center gap-3">
            <span class="location-card-icon rounded-pill d-flex align-items-center justify-content-center fs-24"
                [ngClass]="titleIconClass">
                <i [class]="titleIcon"></i>
            </span>
            <h4 class="mb-0" class="title fw-600">
                <span>{{ title }}</span>
                <span [ngClass]="highlightColor" class="ms-2">{{ highlight }}</span>
            </h4>
        </div>
        <p>{{ subTitle }}</p>
    </div>
    <div class="location-card-content d-flex flex-column gap-3">
        <ng-container *ngFor="let item of content">
            <div class="d-flex flex-row align-items-center gap-3 p-3 hours-row">
                <i class="rounded-pill fs-5 d-flex align-items-center justify-content-center" [class]="item.icon"
                    [ngClass]="item.iconClass"></i>
                <div>
                    <label class="fw-600 text-color2">{{ item.label }}</label>
                    <div class="text-color2">{{ item.Text }}</div>
                </div>
            </div>
            <div class="d-flex color-dot"></div>
        </ng-container>
    </div>

    <!-- Notes Section -->
    <div *ngIf="notes?.length" class="notes-section mt-2 p-4" [ngClass]="notesClass">
        <div class="d-flex flex-row align-items-center gap-3 mb-2">
            <span class="notes-card-icon rounded-pill d-flex align-items-center justify-content-center fs-24"
                [ngClass]="notesIconClass">
                <i [class]="notesIcon"></i>
            </span>
            <p class="mb-0" class="fw-600 mb-0 text-orange fs-18">
                <span>{{ notesTitle }}</span>
            </p>
        </div>
        <div *ngFor="let note of notes" class="d-flex align-items-start gap-2 mb-2 ps-5">
            <span class="note-icon" [ngClass]="note.iconClass">
                <i [class]="note.icon"></i>
            </span>
            <span [ngClass]="note.color" class="fw-500">{{ note.title }}</span>
        </div>
    </div>

</div>
