<div class="testimonial-slider-container d-flex flex-column align-items-center justify-content-center">
  <div class="d-flex align-items-center justify-content-center w-100 mb-2">
    <button class="arrow-btn btn rounded-pill" (click)="prev()">
      <i class="bi bi-chevron-left"></i>
    </button>
    <div class="slider-viewport d-flex flex-row justify-content-center gap-3">
      <div class="testimonial-slide custom-slide p-4 text-center"
           *ngFor="let t of visibleTestimonials">
        <img *ngIf="t.image" [src]="t.image" alt="{{t.author}}" class="testimonial-img mb-3 custom-img"/>
        <div class="fw-bold fs-5 mb-2">{{t.author}}</div>
        <span class=" custom-badge px-3 py-1 mb-2 gradient-bg rounded-pill">
          {{t.tag}}
        </span>
        <div class="mb-2 custom-qualities">{{t.qualities}}</div>
        <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
          <ng-container *ngFor="let star of starsArray; let i = index">
            <span [ngClass]="i < (t.rating ?? 0) ? 'bi bi-star-fill text-warning custom-star' : 'bi bi-star text-light custom-star'"></span>
          </ng-container>
          <span class="ms-3 custom-trophy">
            <i class="bi bi-trophy-fill text-warning"></i> {{t.trophies}}
          </span>
        </div>
        <div class="d-flex justify-content-center gap-4 mb-2">
          <span class="custom-icon-bg custom-icon-medal d-inline-flex align-items-center justify-content-center">
            <i class="bi bi-award-fill"></i>
          </span>
          <span class="custom-icon-bg custom-icon-pacman d-inline-flex align-items-center justify-content-center">
            <i class="bi bi-emoji-smile"></i>
          </span>
          <span class="custom-icon-bg custom-icon-bulb d-inline-flex align-items-center justify-content-center">
            <i class="bi bi-lightbulb"></i>
          </span>
        </div>
      </div>
    </div>
    <button class="arrow-btn btn btn-light rounded-pill" (click)="next()">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
  <div class="slider-indicators d-flex justify-content-center align-items-center mt-2">
    <span
      *ngFor="let i of testimonialsArray; let idx = index"
      class="indicator-dot mx-1"
      [ngClass]="{'active': idx === currentIndex}"
      (click)="goTo(idx)">
    </span>
  </div>
</div>
