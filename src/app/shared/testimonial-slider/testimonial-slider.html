<div class="testimonial-slider-container">
  <h2 class="text-center mb-4"><span class="gradient-text">Top Players of Jumanji</span></h2>
  <div class="d-flex justify-content-center align-items-center gap-3">
    <button class="btn btn-outline-secondary" (click)="prev()" [disabled]="startIndex === 0">
      <i class="bi bi-chevron-left"></i>
    </button>
    <div class="d-flex gap-4 flex-wrap justify-content-center">
      <!-- Show fallback if no testimonials -->
      <ng-container *ngIf="visibleTestimonials?.length; else noTestimonials">
        <div *ngFor="let t of visibleTestimonials" class="testimonial-card p-4 rounded shadow bg-dark text-light">
          <img [src]="t.image" alt="{{t.name}}" class="rounded-circle mb-3" width="80" height="80">
          <h5 class="fw-bold mb-1">{{t.name}}</h5>
          <span class="badge bg-warning text-dark mb-2">{{t.title}}</span>
          <div class="mb-2 text-secondary">{{t.role}}</div>
          <div class="mb-2">
            <ng-container *ngFor="let s of [].constructor(t.stars)">
              <i class="bi bi-star-fill text-warning"></i>
            </ng-container>
          </div>
          <div class="mb-2 text-secondary"><i class="bi bi-chat"></i> {{t.reviews}}</div>
        </div>
      </ng-container>
      <ng-template #noTestimonials>
        <div class="text-center w-100 text-muted py-5">No top players found.</div>
      </ng-template>
    </div>
    <button class="btn btn-outline-secondary" (click)="next()" [disabled]="startIndex + visibleCount >= testimonials.length">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
