<div class="row justify-content-center">
    <div
        class="col-12 col-md-12 col-lg-9 col-xl-6 heading-section d-flex flex-column align-items-center text-center py-4">
        <div class="d-flex align-items-center justify-content-center mb-3 gap-2">
            <ng-container *ngIf="iconLeft">
                <i *ngIf="iconLeftType === 'material'" class="material-icons heading-icon"
                    [ngClass]="iconLeftColor">{{ iconLeft }}</i>
                <i *ngIf="iconLeftType === 'bootstrap'"
                    [ngClass]="[iconLeft, 'heading-icon', iconLeftColor]"></i>
            </ng-container>

            <!-- Title -->
            <h3 class="fw-600 m-0 d-flex align-items-center justify-content-center flex-wrap gap-2">
                <ng-content select="[before-title]"></ng-content>
                <span [ngClass]="titleColor">{{ title }}</span>
                <span [ngClass]="highlightColor">{{ highlight }}</span>
            </h3>
            <ng-container *ngIf="iconRight">
                <i *ngIf="iconRightType === 'material'" class="material-icons heading-icon "
                    [ngClass]="iconRightColor">{{ iconRight }}</i>
                <i *ngIf="iconRightType === 'bootstrap'"
                    [ngClass]="[iconRight, 'heading-icon', iconRightColor]"></i>
            </ng-container>
        </div>

        <!-- Gradient Line -->
        <div class="gradient-line"></div>

        <!-- Subtitle -->
        <div class="d-flex align-items-center justify-content-center subtitle mt-4 fs-5" [ngClass]="subtitleColor">
            <span>{{ subtitle }}</span>
        </div>
    </div>
</div>
