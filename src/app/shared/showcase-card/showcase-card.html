<div class="showcase-card rounded-20 shadow-sm bg-white overflow-hidden h-100 d-flex flex-column">
    <div class="card-img position-relative">
        <img [src]="imageSrc" class="w-100 d-block" alt="Card Image" />
        <div class="badge position-absolute top-0 start-0 m-2" [ngClass]="categoryColor" *ngIf="category">
            {{ category }}
        </div>
        <div class="badge position-absolute top-0 end-0 m-2" [ngClass]="badgeRightColor"
            *ngIf="badgeRight && !starCount">
            {{ badgeRight }}
        </div>
        <div class="badge position-absolute top-0 end-0 m-2 d-flex align-items-center gap-1" *ngIf="starCount"
            [ngClass]="starColor">
            <i class="bi bi-star-fill"></i>
            <span class="fw-bold ms-1">{{ starCount }}</span>
        </div>

    </div>
    <div class="card-body p-3">
        <div class="d-flex align-items-center justify-content-between mb-2">
            <h5 class="fw-bold m-0 text-color">{{ title }}</h5>
            <span class="badge" [ngClass]="priceColor" *ngIf="price">{{ price }}</span>
        </div>
        <div class="subtitle text-color2 mb-3" *ngIf="subtitle">{{ subtitle }}</div>
        <div class="d-flex align-items-center justify-content-between mb-3" *ngIf="players || duration">
            <span [ngClass]="playersClass" *ngIf="players">
                <i class="bi bi-people me-1"></i> {{ players }}
            </span>
            <span [ngClass]="durationClass" *ngIf="duration">
                <i class="bi bi-clock me-1"></i> {{ duration }}
            </span>
        </div>
        <div class="mb-3 d-flex" *ngIf="tags.length">
            <span *ngFor="let tag of tags" class="badge me-2" [ngClass]="tagColor">{{ tag }}</span>
        </div>
        <div class="d-flex align-items-center mb-2" *ngIf="progressLabel">
            <span class="text-color me-3">{{ progressLabel }}</span>
            <div class="progress flex-grow-1" style="height: 8px;">
                <div class="progress-bar" [ngClass]="progressColor" [style.width.%]="progress"></div>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2" *ngIf="buttonText">
            <button class="btn w-100 rounded fw-bold py-2" [ngClass]="[buttonColor, buttonText ? 'mt-0' : '']">
                {{ buttonText }}
            </button>
            <span *ngIf="showCart"
                class="rounded border border-2 d-flex align-items-center justify-content-center text-primary cart">
                <ng-container [ngSwitch]="iconType">
                    <i *ngSwitchCase="'bootstrap'" class="bi" [ngClass]="'bi-' + detailIcon"></i>
                    <span *ngSwitchCase="'material'" class="material-icons">{{ detailIcon }}</span>
                </ng-container>
            </span>
        </div>
    </div>
</div>
