<div class="info-stat-bar d-inline-flex flex-row flex-md-row flex-column align-items-center justify-content-center"
  [class]="isBgColorClass ? bgColor : ''" [ngStyle]="{
    'background': !isBgColorClass ? bgColor : '',
    'box-shadow': shadow ? '0 2px 8px rgba(0,0,0,0.08)' : 'none'
  }">
  <ng-container *ngFor="let stat of stats; let last = last">
    <div class="info-stat-item d-flex flex-row align-items-center px-3 py-2 gap-2">
      <ng-container *ngIf="stat.icon">
        <span [ngClass]="stat.iconClass" class="info-stat-icon fs-4 d-flex justify-content-center align-items-center rounded-pill">
          <i [class]="stat.icon"></i>
        </span>
      </ng-container>
      <div class="d-flex flex-md-column flex-row align-items-center justify-content-center gap-md-0 gap-3">
        <span class="info-stat-title fw-bold fs-4" [ngClass]="stat.titleColor">{{ stat.title }}</span>
        <span class="info-stat-text font-medium">{{ stat.text }}</span>
      </div>
    </div>
    <div *ngIf="!last"
      class="info-stat-divider gradient-bg mx-2 d-none d-md-block"></div>
    <div *ngIf="!last"
      class="info-stat-divider gradient-bg my-2 d-block d-md-none"></div>
  </ng-container>
</div>
