<div class="slider-container position-relative overflow-hidden w-100" [class.rtl]="isRTL">
  <div class="slider-wrapper position-relative w-100  py-4 overflow-hidden">
    <div class="slider-content d-flex flex-nowrap w-100" [ngStyle]="{'transform': 'translateX(' + translateX + 'px)', 'transition': isAnimating ? 'transform 0.3s ease' : 'none'}">
      <ng-container *ngFor="let item of displayItems; let i = index; trackBy: trackByFn">
        <div class="slider-item" [ngStyle]="{'width.px': itemWidth}">
          <div class="card-container">
            <ng-container *ngTemplateOutlet="itemTemplate; context: {$implicit: item}"></ng-container>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
  
  <div class="navigation-container position-relative w-100 d-flex align-items-center justify-content-center mt-4 pb-3" *ngIf="showIndicators">
    <button class="slider-nav-btn btn-purple mx-2 d-flex align-items-center justify-content-center" [ngClass]="isRTL ? 'slider-nav-next' : 'slider-nav-prev'" (click)="navigatePrev()">
      <i class="bi" [ngClass]="prevIcon"></i>
    </button>
    
    <div class="slider-indicators d-flex align-items-center">
      <span *ngFor="let _ of items; let i = index" 
            class="slider-indicator-dot mx-1"
            [ngClass]="{'active': activeIndicatorIndex === i}"
            (click)="goToSlide(i)"></span>
    </div>
    
    <button class="slider-nav-btn btn-yellow mx-2 d-flex align-items-center justify-content-center" [ngClass]="isRTL ? 'slider-nav-prev' : 'slider-nav-next'" (click)="navigateNext()">
      <i class="bi" [ngClass]="nextIcon"></i>
    </button>
  </div>
</div>
<ng-content></ng-content>
