<div id="cafeMenuCarousel" class="carousel slide cafe-menu-slider" data-bs-ride="carousel">
  <div class="carousel-inner">
    <ng-content></ng-content>
  </div>
</div>
<!-- Indicators and arrows centered below the slider -->
<div class="d-flex justify-content-center align-items-center gap-3 mt-3">
  <button class="carousel-control-prev" type="button" data-bs-target="#cafeMenuCarousel" data-bs-slide="prev" style="position:static;">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <div class="carousel-indicators m-0 position-static d-flex gap-2">
    <button *ngFor="let game of menu; let i = index"
      type="button"
      data-bs-target="#cafeMenuCarousel"
      [attr.data-bs-slide-to]="i"
      [class.active]="i === 0"
      [attr.aria-current]="i === 0 ? 'true' : null"
      [attr.aria-label]="'Slide ' + (i + 1)">
    </button>
  </div>
  <button class="carousel-control-next" type="button" data-bs-target="#cafeMenuCarousel" data-bs-slide="next" style="position:static;">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
