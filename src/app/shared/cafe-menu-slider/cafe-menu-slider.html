<div id="cafeMenuCarousel" class="carousel slide cafe-menu-slider" data-bs-ride="carousel">
  <div class="carousel-inner">
    <!-- Projected carousel items from parent -->
    <ng-content></ng-content>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#cafeMenuCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#cafeMenuCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
  <!-- Dots/indicators should also be projected or handled by parent if dynamic -->
</div>
  <button class="carousel-control-prev" type="button" data-bs-target="#cafeMenuCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#cafeMenuCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
  <div class="carousel-indicators">
    <button *ngFor="let game of menu; let i = index"
      type="button"
      data-bs-target="#cafeMenuCarousel"
      [attr.data-bs-slide-to]="i"
      [class.active]="i === 0"
      aria-current="i === 0 ? 'true' : null"
      [attr.aria-label]="'Slide ' + (i + 1)">
    </button>
  </div>
